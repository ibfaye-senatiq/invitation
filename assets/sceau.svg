<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 580" width="100%" height="100%">
  <defs>
    <!-- Soft Ambient Elevation Shadow -->
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1B0409" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1B0409" flood-opacity="0.2" />
    </filter>

    <filter id="shadow-ribbon-left" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-4" dy="8" stdDeviation="8" flood-color="#120206" flood-opacity="0.35" />
    </filter>

    <filter id="shadow-ribbon-right" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#120206" flood-opacity="0.35" />
    </filter>

    <!-- Color Gradients -->
    <radialGradient id="seal-body" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#A5203D" />
      <stop offset="55%" stop-color="#7B1127" />
      <stop offset="100%" stop-color="#540817" />
    </radialGradient>

    <linearGradient id="inner-well" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#600A1B" />
      <stop offset="100%" stop-color="#7C1229" />
    </linearGradient>

    <linearGradient id="ribbon-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#730F24" />
      <stop offset="100%" stop-color="#430612" />
    </linearGradient>

    <linearGradient id="ribbon-r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#801229" />
      <stop offset="100%" stop-color="#4A0714" />
    </linearGradient>

    <linearGradient id="gold-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E19C" />
      <stop offset="50%" stop-color="#C59B3F" />
      <stop offset="100%" stop-color="#E5C775" />
    </linearGradient>
  </defs>

  <!-- ================= RIBBONS (BACKGROUND LAYER) ================= -->
  <g id="ribbons">
    <!-- Left Ribbon -->
    <path filter="url(#shadow-ribbon-left)" d="M 185 280 
             L 135 520 
             L 185 480 
             L 235 520 
             L 225 290 Z" fill="url(#ribbon-l)" />

    <!-- Right Ribbon -->
    <path filter="url(#shadow-ribbon-right)" d="M 275 290 
             L 265 520 
             L 315 480 
             L 365 520 
             L 315 280 Z" fill="url(#ribbon-r)" />

    <!-- Left Ribbon Fold/Shading -->
    <path d="M 185 280 L 230 330 L 225 290 Z" fill="#2A0209" opacity="0.4" />
    <!-- Right Ribbon Fold/Shading -->
    <path d="M 315 280 L 270 330 L 275 290 Z" fill="#2A0209" opacity="0.4" />
  </g>

  <!-- ================= MAIN ROSETTE / MEDALLION ================= -->
  <g id="seal" filter="url(#shadow-main)">
    <!-- 24-point Scalloped Outer Boundary -->
    <path fill="url(#seal-body)" d="
      M 250 50
      C 260 50, 269 57, 275 64   C 285 62, 296 66, 304 74
      C 313 75, 323 81, 327 91   C 337 94, 345 102, 349 113
      C 357 119, 363 129, 363 140 C 371 149, 374 160, 372 171
      C 378 182, 377 194, 373 205 C 377 217, 374 229, 368 239
      C 370 251, 364 262, 355 270 C 353 282, 344 292, 333 297
      C 328 308, 317 315, 306 317 C 298 327, 286 331, 274 330
      C 266 338, 253 342, 241 341 C 230 348, 217 348, 207 342
      C 195 345, 183 340, 174 332 C 163 333, 151 328, 143 320
      C 133 318, 122 310, 117 300 C 107 294, 99 285, 96 273
      C 88 264, 83 253, 85 241   C 79 231, 77 218, 80 207
      C 77 195, 78 183, 83 172   C 82 161, 86 149, 94 141
      C 95 130, 102 120, 111 113 C 115 103, 124 95, 134 92
      C 140 82, 150 76, 161 74   C 169 66, 180 62, 191 64
      C 200 56, 212 51, 224 51   C 232 46, 243 46, 250 50 Z" />

    <!-- Rim Highlight Ring -->
    <circle cx="228" cy="197" r="142" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2" />

    <!-- Recessed Inner Well -->
    <circle cx="228" cy="197" r="128" fill="url(#inner-well)" stroke="#38040E" stroke-width="3" />

    <!-- Outer Gold Border -->
    <circle cx="228" cy="197" r="120" fill="none" stroke="url(#gold-stroke)" stroke-width="2.5" stroke-opacity="0.85" />

    <!-- Concentric Technical / Decorative Ticks -->
    <circle cx="228" cy="197" r="113" fill="none" stroke="url(#gold-stroke)" stroke-width="1" stroke-dasharray="2 6" stroke-opacity="0.5" />

    <!-- Inner Core Accent Ring -->
    <circle cx="228" cy="197" r="106" fill="none" stroke="url(#gold-stroke)" stroke-width="1.2" stroke-opacity="0.75" />

    <!-- Subtle Top Ambient Arc (Sleek Rim Light) -->
    <path d="M 128 170 A 110 110 0 0 1 328 170" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.15" />
  </g>
</svg>